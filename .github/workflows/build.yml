name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: beastsofburden-native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: powershell

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        (github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]')))
    runs-on: [self-hosted, Windows, X64, awl-ci, awl-ci-windows, awl-eu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select existing native .NET 10 SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'global.json') { throw 'An existing global.json must be reconciled before SDK selection.' }
          $available = @(dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versions = @($available | ForEach-Object {
            if ($_ -match '^(10\.0\.[0-9]+)\s+\[') { [version]$Matches[1] }
          } | Sort-Object -Descending)
          if ($versions.Count -eq 0) { throw 'The existing native runner requires a stable .NET 10.0 SDK.' }
          $selected = $versions[0].ToString()
          $configuration = @{sdk=@{version=$selected; rollForward='disable'; allowPrerelease=$false}} | ConvertTo-Json -Depth 3
          [System.IO.File]::WriteAllText((Join-Path $PWD 'global.json'), $configuration, [System.Text.UTF8Encoding]::new($false))
          $actual = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $selected) { throw 'The selected SDK was not used.' }
          Write-Output ('Using existing native .NET SDK ' + $actual)

      - name: Install compile-time reference assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          $root = [System.IO.Path]::GetFullPath((Join-Path $tempRoot ('valheim-refs-' + [guid]::NewGuid().ToString('N'))))
          if (-not $root.StartsWith($tempRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Reference files must stay in the runner temporary directory.' }
          if (Test-Path -LiteralPath $root) { throw 'Reference directory must be new for this job.' }
          $pfRoot = Join-Path $root 'pfhoenix'
          $drRoot = Join-Path $root 'digitalroot'
          $refs = Join-Path $root 'combined'
          New-Item -ItemType Directory -Path $pfRoot,$drRoot,$refs -Force | Out-Null

          $pfZip = Join-Path $root 'pfhoenix.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/pfhoenix.valheim.modprojectreferences/1.0.24/pfhoenix.valheim.modprojectreferences.1.0.24.nupkg' -OutFile $pfZip
          Expand-Archive $pfZip $pfRoot -Force

          $drZip = Join-Path $root 'digitalroot.zip'
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/digitalroot.valheim.common.references/1.0.12/digitalroot.valheim.common.references.1.0.12.nupkg' -OutFile $drZip
          Expand-Archive $drZip $drRoot -Force

          $bepRoot = Join-Path $root 'bepinex'
          $bepZip = Join-Path $root 'bepinex.zip'
          New-Item -ItemType Directory -Path $bepRoot -Force | Out-Null
          Invoke-WebRequest 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/' -OutFile $bepZip
          Expand-Archive $bepZip $bepRoot -Force
          $bepInExDll = Get-ChildItem $bepRoot -Recurse -File -Filter BepInEx.dll | Select-Object -First 1
          $harmonyDll = Get-ChildItem $bepRoot -Recurse -File -Filter 0Harmony.dll | Select-Object -First 1
          if (-not $bepInExDll -or -not $harmonyDll) { throw 'Current BepInEx reference assemblies not found' }

          Copy-Item (Join-Path $pfRoot 'lib\net46\*.dll') $refs
          Copy-Item (Join-Path $drRoot 'ref\net48\assembly_valheim-publicized.dll') (Join-Path $refs 'assembly_valheim.dll') -Force
          Copy-Item (Join-Path $drRoot 'ref\net48\assembly_googleanalytics-publicized.dll') (Join-Path $refs 'assembly_googleanalytics.dll') -Force
          Copy-Item (Join-Path $drRoot 'ref\net48\assembly_utils-publicized.dll') (Join-Path $refs 'assembly_utils.dll') -Force
          Copy-Item $bepInExDll.FullName (Join-Path $refs 'BepInEx.dll') -Force
          Copy-Item $harmonyDll.FullName (Join-Path $refs '0Harmony.dll') -Force

          "BEPINEX_CORE_DIR=$refs" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VALHEIM_MANAGED_DIR=$refs" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: dotnet build .\BeastsOfBurden\BeastsOfBurden.csproj -c Release --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: BeastsOfBurden-1.0.7
          path: BeastsOfBurden/bin/Release/net472/BeastsOfBurden.dll
