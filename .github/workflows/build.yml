name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valheim dedicated server references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $steam = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $game = Join-Path $env:RUNNER_TEMP 'valheim-server'
          New-Item -ItemType Directory -Path $steam,$game -Force | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip
          Expand-Archive $zip $steam -Force
          & (Join-Path $steam 'steamcmd.exe') +force_install_dir $game +login anonymous +app_update 896660 validate +quit
          if ($LASTEXITCODE -ne 0) { throw "steamcmd exited $LASTEXITCODE" }
          "VALHEIM_MANAGED_DIR=$(Join-Path $game 'valheim_server_Data\Managed')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install BepInEx references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'bepinex'
          $zip = Join-Path $env:RUNNER_TEMP 'bepinex.zip'
          Invoke-WebRequest 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/' -OutFile $zip
          Expand-Archive $zip $root -Force
          $dll = Get-ChildItem $root -Recurse -File -Filter BepInEx.dll | Select-Object -First 1
          if (-not $dll) { throw 'BepInEx.dll not found in downloaded package' }
          "BEPINEX_CORE_DIR=$($dll.Directory.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: dotnet build .\BeastsOfBurden\BeastsOfBurden.csproj -c Release --nologo

      - uses: actions/upload-artifact@v4
        with:
          name: BeastsOfBurden-1.0.5
          path: BeastsOfBurden/bin/Release/net472/BeastsOfBurden.dll
